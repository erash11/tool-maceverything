name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build -c release
      - name: Mount a test volume
        run: |
          hdiutil create -size 64m -fs APFS -volname MEVTest "$RUNNER_TEMP/mevtest.dmg"
          hdiutil attach "$RUNNER_TEMP/mevtest.dmg"
          echo "MEV_TEST_VOLUME=/Volumes/MEVTest" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Benchmark on /usr and /Applications
        run: |
          .build/release/ev --bench /usr
          .build/release/ev --bench /Applications
      - name: searchfs benchmark (issue 6)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          .build/release/ev --bench-searchfs /Volumes/MEVTest
          .build/release/ev --bench-searchfs /System/Volumes/Data
      - name: Bundle the app
        run: ./scripts/make-app.sh && ls -la build
      # Upload now, while the app is ad-hoc signed: the next step re-signs it with a throwaway
      # CI certificate that no other Mac trusts. ditto keeps the bundle's signature intact.
      # scripts/install-app-from-ci.sh installs this artifact.
      - name: Zip the app bundle
        run: ditto -c -k --keepParent build/MacEverything.app build/MacEverything.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacEverything-app
          path: build/MacEverything.app.zip
          if-no-files-found: error
      - name: Stable signing identity (issue 7)
        run: |
          ./scripts/create-signing-cert.sh --ci
          ./scripts/make-app.sh | tee sign.log
          grep -q 'Signed with: MacEverything Local Signing' sign.log
          codesign --verify --strict --verbose=2 build/everythingd build/ev build/MacEverything.app
          # A different build of the daemon, signed the same way, stands in for "a rebuild".
          swift build -c debug --product everythingd
          cp .build/debug/everythingd build/everythingd-rebuilt
          codesign --force --options runtime --sign "MacEverything Local Signing" \
            --identifier com.erash11.maceverything.daemon build/everythingd-rebuilt
          req1="$(codesign -d -r- build/everythingd 2>&1 | grep designated)"
          req2="$(codesign -d -r- build/everythingd-rebuilt 2>&1 | grep designated)"
          hash1="$(codesign -dvvv build/everythingd 2>&1 | grep '^CDHash=')"
          hash2="$(codesign -dvvv build/everythingd-rebuilt 2>&1 | grep '^CDHash=')"
          echo "release: $hash1"; echo "debug:   $hash2"; echo "requirement: $req1"
          [ "$hash1" != "$hash2" ]                      # different binaries
          [ "$req1" = "$req2" ]                         # same requirement, so TCC grants carry over
          echo "$req1" | grep -q 'certificate leaf'
          echo "$req1" | grep -q 'identifier "com.erash11.maceverything.daemon"'
          ! echo "$req1" | grep -q cdhash
