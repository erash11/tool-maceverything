name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build -c release
      - name: Mount a test volume
        run: |
          hdiutil create -size 64m -fs APFS -volname MEVTest "$RUNNER_TEMP/mevtest.dmg"
          hdiutil attach "$RUNNER_TEMP/mevtest.dmg"
          echo "MEV_TEST_VOLUME=/Volumes/MEVTest" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Benchmark on /usr and /Applications
        run: |
          .build/release/ev --bench /usr
          .build/release/ev --bench /Applications
      - name: searchfs benchmark (issue 6)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          .build/release/ev --bench-searchfs /Volumes/MEVTest
          .build/release/ev --bench-searchfs /System/Volumes/Data
      - name: Bundle the app
        run: ./scripts/make-app.sh && ls -la build
