name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Benchmark on /usr and /Applications
        run: |
          .build/release/ev --bench /usr
          .build/release/ev --bench /Applications
      - name: Bundle the app
        run: ./scripts/make-app.sh && ls -la build
